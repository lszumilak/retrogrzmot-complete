<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
<title id="title">RETROGRZMOT EXIT — BCM26, physical pin 37</title>
<desc id="desc">Normally open momentary button connects physical pin 37, BCM GPIO26, to ground. Physical pin 34 is an example free ground. Top view of the 40-pin header. POWER uses SHIM BTN and GPIO4/17.</desc>
