<text x="35" y="80" font-size="20" style="fill:#c2f464">Raspberry Pi 3B+ · BCM GPIO26 = D26 = physical pin 37</text>
<text x="35" y="113" font-size="17" style="fill:#ffca85">Odłącz zasilacze przed podłączeniem / Disconnect all power before wiring</text>
